name: Metrics Visual Dark

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate High-Visual Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.rendered.svg
          
          # Visual & Tema (Opções: dark, midnight, classic, terminal)
          config_theme: dark
          config_timezone: America/Sao_Paulo
          
          # Calendário 3D Isométrico (Efeito Cidade)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Gráfico de Linguagens
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          
          # Quadro de Conquistas (Badges estilo videogame)
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
          
          # Gráficos de Hábitos de Codificação
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
